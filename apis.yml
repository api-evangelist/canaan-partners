aid: canaan-partners
name: Canaan Partners
description: >-
  Canaan Partners is an early-stage venture capital firm founded in 1987 as a
  management buyout spin-out from General Electric's venture unit. The firm
  invests in "visionaries with transformative ideas," backing companies from
  seed through Series A across a roughly 60/40 split between technology and
  healthcare. On the technology side Canaan funds developer tools, security,
  infrastructure, fintech, consumer, AI, and frontier/deep-tech companies; on
  the healthcare side it specializes in de novo biotech creation, therapeutics,
  and medical devices. Headquartered in Stamford, Connecticut with offices in
  San Francisco, Menlo Park, and New York City, Canaan has raised roughly $7
  billion across 13 funds and is actively deploying Fund XIII. Over its 37-year
  history the firm reports a track record of 73 IPOs and 152 M&A exits, with
  notable investments including Instacart, LendingClub, The RealReal, DexCom,
  Match.com, Snyk, Turo, Cardlytics, and Day One Biopharmaceuticals.
